# Publish the app to GitHub Pages.
#
# Only `app/` is deployed, so the site root is index.html and every relative
# path in the page resolves the same way it does locally. Pages serves over
# HTTPS, which is what Web Serial needs: the API is unavailable in an insecure
# context, so this cannot be hosted over plain HTTP.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No dependencies to install: the tests are plain Node.
      - name: Run tests
        working-directory: app
        run: |
          for t in *.test.cjs; do
            echo "--- $t"
            node "$t" || exit 1
          done

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@v4
